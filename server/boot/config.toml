[Core]
port = ":8080"
frontend_url = "http://localhost:5173"
jwt_key = "dev-insecure-change-me"
cookie_secure = false
cookie_samesite = "lax"
dev_login = true
oauth_redirect_url = "http://localhost:8080/auth/github/callback"

[DB]
# DATABASE_URL takes precedence when set. Supabase example:
# postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
url = ""
host = "localhost"
user = "user"
password = "password"
dbname = "typedata"
port = 5432
sslmode = "disable"
max_open_conns = 10
max_idle_conns = 5

[Redis]
# REDIS_URL takes precedence when set. Use rediss:// for TLS.
url = ""
addr = "localhost:6379"
password = ""
db = 0
tls = false

[CodeGen]
service_url = "http://localhost:8081/generate"
tokens = 120

[BugReport]
webhook_url = ""

[Metrics]
# Optional bearer token for GET /metrics. Leave empty to expose metrics.
token = ""

[Admin]
# Primary operator username. The account is always admin and can promote or
# demote other accounts. Set ADMIN_USERNAME in production.
primary_username = ""
health_interval_seconds = 60

[Game]
countdown_ms = 3000

[Matchmaking]
tick_ms = 500
base_range = 100
growth_range = 50
max_players = 4
bot_after_seconds = 20

[Contests]
lobby_minutes = 2

[Bots.LEWIS]
accuracy = 95
relative_speed = 1.2
rating = 600

[Bots.MAX]
accuracy = 85
relative_speed = 1.5
rating = 500

[Bots.LANCE]
accuracy = 75
relative_speed = 1.8
rating = 400
