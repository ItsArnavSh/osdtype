services:
  postgres:
    image: postgres:16
    container_name: osdtyp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: typedata
    ports:
      - "5432:5432"
    volumes:
      - ./docker_data/postgres_data:/var/lib/postgresql/data
    command: postgres -c listen_addresses='*'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d typedata"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: osdtyp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker_data/redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  codegen:
    build:
      context: .
      dockerfile: codegen/Dockerfile
    container_name: osdtyp_codegen
    restart: unless-stopped
    environment:
      CODEGEN_BIND: "0.0.0.0:8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osdtyp_server
    restart: unless-stopped
    environment:
      PORT: ":8080"
      FRONTEND_URL: "http://localhost:5173"
      JWTKEY: "${JWTKEY:-dev-compose-change-me}"
      DEV_LOGIN: "true"
      COOKIE_SECURE: "false"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: user
      DB_PASSWORD: password
      DB_DBNAME: typedata
      REDIS_ADDR: "redis:6379"
      CODEGEN_URL: "http://codegen:8081/generate"
      GITHUB_KEY: "${GITHUB_KEY:-}"
      GITHUB_AUTH: "${GITHUB_AUTH:-}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      codegen:
        condition: service_healthy
