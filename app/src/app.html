<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#070707" />
		<meta name="application-name" content="OSDTYP" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="OSDTYP" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta
			name="description"
			content="OSDTYP — seeded code typing practice, ranked races, rooms, and contests."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:title" content="OSDTYP" />
		<meta
			property="og:description"
			content="Seeded code typing practice, ranked races, rooms, and contests."
		/>
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="OSDTYP" />
		<meta name="twitter:description" content="Seeded code typing practice." />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Fira+Code:wght@300..700&family=Share+Tech&family=Silkscreen:wght@400;700&family=VT323&display=swap"
			rel="stylesheet"
			crossorigin="anonymous"
		/>
		%sveltekit.head%
		<script>
			// Applied before first paint so a saved theme never flashes.
			try {
				const versionKey = 'osdtype.themeDefaultVersion';
				const version = 'mono-1';
				let stored = localStorage.getItem('osdtype.theme');
				if (localStorage.getItem(versionKey) !== version) {
					if (stored === 'carbon') {
						stored = 'mono';
						localStorage.setItem('osdtype.theme', stored);
					}
					localStorage.setItem(versionKey, version);
				}
				document.documentElement.dataset.theme = stored || 'mono';
			} catch (e) {
				document.documentElement.dataset.theme = 'mono';
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
